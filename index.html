<title>Chess</title>
<style>
:root {
  --bg: #E6EBF1; --card: #FFFFFF; --ink: #1B2530; --soft: #5A6776; --line: #CBD3DD; --chip: #DFE7F1;
  --on: #1B2530; --on-ink: #FFFFFF; --accent: #1B56C9; --scrim: rgba(15, 20, 26, .45);
  --good: #1E8449; --good-bg: #DDF3E5; --ok: #8A6A00; --ok-bg: #FFF2C2; --warn: #B45309; --warn-bg: #FFE4CC; --bad: #C4122F; --bad-bg: #FFDCE1;
  --light: #E9EEF4; --dark: #8FA5BF; --last: rgba(255, 212, 59, .75); --sel: rgba(255, 212, 59, .95); --dotc: rgba(27, 37, 48, .38);
  --arrow: #1B8F4A; --coord-l: #6F87A3; --coord-d: #F2F5F9;
}
:root[data-board="green"] { --light: #EEEED2; --dark: #769656; --coord-l: #769656; --coord-d: #EEEED2; }
:root[data-board="wood"] { --light: #F0D9B5; --dark: #B58863; --coord-l: #B58863; --coord-d: #F0D9B5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --card: #1A222C; --ink: #EEF2F6; --soft: #97A4B2; --line: #334050; --chip: #26303C;
    --on: #EEF2F6; --on-ink: #0F141A; --accent: #8DBBFF; --scrim: rgba(0, 0, 0, .6);
    --good: #6FD69A; --good-bg: #173424; --ok: #F2CD5C; --ok-bg: #3A3212; --warn: #FFB57A; --warn-bg: #3F2814; --bad: #FF7A8A; --bad-bg: #4A1D25;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --card: #1A222C; --ink: #EEF2F6; --soft: #97A4B2; --line: #334050; --chip: #26303C;
  --on: #EEF2F6; --on-ink: #0F141A; --accent: #8DBBFF; --scrim: rgba(0, 0, 0, .6);
  --good: #6FD69A; --good-bg: #173424; --ok: #F2CD5C; --ok-bg: #3A3212; --warn: #FFB57A; --warn-bg: #3F2814; --bad: #FF7A8A; --bad-bg: #4A1D25;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app {
  height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; padding: 4px 8px 0;
  --bw: min(calc(100vw - 16px), calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 350px), 600px);
  overflow: hidden;
}
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 4px; }
.top h1 { font-size: 24px; margin: 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.iconbtn svg { width: 26px; height: 26px; }
.player { width: var(--bw); margin: 0 auto; min-height: 30px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
.player .who { white-space: nowrap; flex: none; }
.player .caps { display: flex; margin-left: auto; min-width: 0; overflow: hidden; justify-content: flex-end; }
.player .caps svg { width: 18px; height: 18px; margin-left: -6px; flex: none; }
.player .lead { color: var(--soft); font-size: 15px; }
.think { font-style: normal; color: var(--accent); font-weight: 600; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.solvedtag { color: var(--good); }

.boardwrap { position: relative; width: var(--bw); height: var(--bw); margin: 0 auto; border-radius: 6px; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--line); }
#board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
.sq { position: relative; display: grid; place-items: center; }
.sq.light { background: var(--light); }
.sq.dark { background: var(--dark); }
.sq.last::before, .sq.sel::before, .sq.hint::before, .sq.wrong::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--last); }
.sq.sel::before { background: var(--sel); }
.sq.hint::before { box-shadow: inset 0 0 0 5px var(--arrow); background: rgba(27, 143, 74, .18); }
.sq.wrong::before { background: rgba(196, 18, 47, .55); }
.sq.check::before { background: radial-gradient(circle, rgba(230, 30, 50, .95) 20%, rgba(230, 30, 50, .35) 55%, transparent 72%); }
.sq.dot::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dotc); z-index: 3; pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid var(--dotc); z-index: 3; pointer-events: none; }
.pc { width: 92%; height: 92%; position: relative; z-index: 2; pointer-events: none; }
.rk, .fl { position: absolute; font-size: calc(var(--bw) / 36); font-weight: 700; z-index: 1; line-height: 1; }
.rk { top: 3px; left: 3px; } .fl { bottom: 2px; right: 3px; }
.sq.light .rk, .sq.light .fl { color: var(--coord-l); } .sq.dark .rk, .sq.dark .fl { color: var(--coord-d); }
#arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

.movelist { width: var(--bw); margin: 4px auto 0; white-space: nowrap; overflow-x: auto; font-size: 15px; color: var(--soft); min-height: 22px; scrollbar-width: none; }
.movelist::-webkit-scrollbar { display: none; }
.movelist em { font-style: normal; opacity: .7; margin-left: 4px; }
.movelist span.cur { color: var(--ink); font-weight: 700; }
.muted { opacity: .85; }
.status { width: var(--bw); margin: 6px auto 0; background: var(--card); border-radius: 14px; padding: 11px 14px; font-size: 17px; line-height: 1.4; min-height: 54px; flex: 0 1 auto; max-height: 140px; overflow-y: auto; }
.status b { font-weight: 700; }
.status.good { background: var(--good-bg); } .status.good b { color: var(--good); }
.status.ok { background: var(--ok-bg); } .status.ok b { color: var(--ok); }
.status.warn { background: var(--warn-bg); } .status.warn b { color: var(--warn); }
.status.bad { background: var(--bad-bg); } .status.bad b, .status .retry { color: var(--bad); font-weight: 700; }
.controls { width: var(--bw); margin: auto auto 6px; padding-top: 6px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0; border-radius: 14px; font-size: 14px; font-weight: 600; color: var(--soft); background: var(--card); }
.ctl svg { width: 26px; height: 26px; color: var(--ink); }
.ctl.primary { background: var(--on); color: var(--on-ink); }
.ctl.primary svg { color: var(--on-ink); }
.ctl:active { transform: scale(.96); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin: 0 -8px; padding: 4px 8px 6px; background: var(--bg); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 13px; font-weight: 600; color: var(--soft); padding: 5px 0; }
.tab svg { width: 28px; height: 28px; }
.tab.on { color: var(--accent); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 54px); transform: translate(-50%, -10px); background: var(--on); color: var(--on-ink);
  padding: 11px 18px; border-radius: 14px; font-size: 16px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.scrim { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
.scrim.open { display: flex; }
.sheet { background: var(--card); width: 100%; max-width: 620px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); max-height: 90vh; overflow-y: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 2px 0 12px; font-size: 24px; }
.sheet h3 { margin: 18px 0 8px; font-size: 16px; color: var(--soft); font-weight: 600; display: flex; justify-content: space-between; }
.sheet h3 .count { font-weight: 500; }
.sheet p { font-size: 17px; line-height: 1.45; color: var(--soft); }
.note { font-size: 15px !important; }
.big { display: block; width: 100%; padding: 14px 16px; border-radius: 16px; font-size: 19px; font-weight: 700; background: var(--chip); margin-bottom: 8px; text-align: left; position: relative; }
.big small { display: block; font-size: 15px; font-weight: 500; color: var(--soft); margin-top: 2px; }
.big.primary { background: var(--on); color: var(--on-ink); text-align: center; margin-top: 12px; }
.big.on { box-shadow: inset 0 0 0 3px var(--accent); }
.badge { position: absolute; right: 12px; top: 14px; font-size: 13px; padding: 3px 8px; border-radius: 8px; font-weight: 700; }
.badge.mastered { background: var(--good-bg); color: var(--good); } .badge.practiced { background: var(--ok-bg); color: var(--ok); }
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg.wide button { flex: 1; }
.seg button { padding: 9px 12px; border-radius: 9px; font-size: 16px; font-weight: 600; color: var(--soft); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--chip); font-size: 18px; }
.row small { display: block; font-size: 14px; color: var(--soft); margin-top: 2px; }
.switch { width: 54px; height: 32px; border-radius: 16px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch[aria-checked="true"] { background: #2E9E5B; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.pzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pz { background: var(--chip); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 76px; }
.pz b { font-size: 22px; } .pz span { font-size: 13px; color: var(--soft); text-align: center; line-height: 1.2; }
.pz.clean { background: var(--good-bg); } .pz.clean b { color: var(--good); }
.pz.helped { background: var(--ok-bg); } .pz.helped b { color: var(--ok); }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.promo button { background: var(--light); border-radius: 16px; aspect-ratio: 1; display: grid; place-items: center; }
.promo svg { width: 80%; height: 80%; }
table.stats { width: 100%; border-collapse: collapse; font-size: 17px; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { padding: 10px 4px; text-align: right; border-bottom: 1px solid var(--chip); }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { font-size: 15px; color: var(--soft); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>

<script id="engine">
// ===== Chess engine: 0x88 board, full rules, SAN/FEN, alpha-beta search =====
const WHITE = 8, BLACK = 16;
const P = 1, N = 2, BSH = 3, RK = 4, Q = 5, K = 6;
const PIECE_CH = { 1: 'p', 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };
const CH_PIECE = { p: 1, n: 2, b: 3, r: 4, q: 5, k: 6 };
const N_OFF = [-33, -31, -18, -14, 14, 18, 31, 33];
const B_OFF = [-17, -15, 15, 17];
const R_OFF = [-16, -1, 1, 16];
const K_OFF = [-17, -16, -15, -1, 1, 15, 16, 17];
const F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8, F_PROMO = 16;
const VAL = [0, 100, 320, 330, 500, 900, 0];

function sqName(s) { return 'abcdefgh'[s & 7] + (8 - (s >> 4)); }
function nameSq(n) { return (8 - +n[1]) * 16 + 'abcdefgh'.indexOf(n[0]); }
function mv(from, to, flags = 0, promo = 0) { return from | (to << 7) | (promo << 14) | (flags << 17); }
const mFrom = m => m & 127, mTo = m => (m >> 7) & 127, mPromo = m => (m >> 14) & 7, mFlags = m => m >> 17;

// Zobrist (two 26-bit halves combined into one safe integer key)
let seed = 1234567;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed & 0x3ffffff; }
const Z = []; for (let i = 0; i < 32 * 128; i++) Z.push([rnd(), rnd()]);
const ZTURN = [rnd(), rnd()], ZCAST = [], ZEP = [];
for (let i = 0; i < 16; i++) ZCAST.push([rnd(), rnd()]);
for (let i = 0; i < 128; i++) ZEP.push([rnd(), rnd()]);

class Chess {
  constructor(fen) { this.load(fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'); }
  load(fen) {
    const [pos, turn, cast, ep, half, full] = fen.trim().split(/\s+/);
    this.b = new Array(128).fill(0); this.kings = { 8: -1, 16: -1 };
    let s = 0;
    for (const ch of pos) {
      if (ch === '/') s += 8;
      else if (/\d/.test(ch)) s += +ch;
      else {
        const col = ch === ch.toUpperCase() ? WHITE : BLACK, t = CH_PIECE[ch.toLowerCase()];
        this.b[s] = col | t; if (t === K) this.kings[col] = s; s++;
      }
    }
    this.turn = turn === 'b' ? BLACK : WHITE;
    this.castle = (cast || '-').split('').reduce((a, c) => a | ({ K: 1, Q: 2, k: 4, q: 8 }[c] || 0), 0);
    this.ep = ep && ep !== '-' ? nameSq(ep) : -1;
    this.half = +half || 0; this.full = +full || 1;
    this.hist = []; this.keys = [];
    this.computeKey();
  }

      this.analysis = ask('analyze', START, this.s.moves.slice(), { depth: 3, time: 1200 });
    } else {
      this.thinking = true; this.refresh();
      const lv = LEVELS[this.s.level];
      const [r] = await Promise.all([ask('move', START, this.s.moves.slice(), lv), sleep(450)]);
      if (t !== token || this.s !== this.cur()) return;
      this.thinking = false;
      if (!r.move) return;
      const m = g.moveFromUci(r.move);
      this.apply(m, true);
      if (!this.coachMsg) this.refresh(this.s.result ? undefined : 'Your move.');
      else { this.refresh(this.coachMsg[0], this.coachMsg[1]); this.coachMsg = null; }
      this.turn();
    }
  },
  cur() { return this.s; },
  apply(m, animate) {
    const g = B.game, san = g.san(m);
    this.s.moves.push(uci(m)); this.s.sans.push(san);
    g.make(m); B.last = [mFrom(m), mTo(m)]; B.arrows = [];
    if (animate) B.animate = B.last;
    this.save();
  },
  async userMove(m) {
    const t = token, g = B.game, before = this.analysis, u = uci(m);
    const beforeMoves = this.s.moves.slice();
    const captured = describeCapture(g, m);
    this.apply(m, false); this.coachMsg = null;
    this.refresh('');
    if (settings.coach && before) {
      before.then(async a => {
        if (t !== token) return;
        const best = a.scores[0], mine = a.scores.find(x => x.u === u);
        if (!best || !mine) return;
        const loss = cp(best.s) - cp(mine.s);
        const pg = new Chess(START); for (const x of beforeMoves) pg.make(pg.moveFromUci(x));
        const bestSan = pg.san(pg.moveFromUci(best.u));
        let msg, tone;
        if (best.u === u) { msg = mateIn(best.s) > 0 ? `<b>Best move.</b> Mate is coming.` : `<b>Best move.</b>`; tone = 'good'; }
        else if (loss <= 60) { msg = `<b>Good move.</b>`; tone = 'good'; }
        else if (loss <= 150) { msg = `<b>Inaccuracy.</b> ${bestSan} was a bit better.`; tone = 'ok'; }
        else {
          const label = loss <= 350 ? 'Mistake' : 'Blunder';
          tone = loss <= 350 ? 'warn' : 'bad';
          if (mateIn(best.s) > 0) msg = `<b>${label}.</b> You had checkmate in ${mateIn(best.s)}, starting with ${bestSan}.`;
          else if (mateIn(mine.s) < 0) msg = `<b>${label}.</b> This lets them checkmate you. ${bestSan} was needed.`;
          else {
            const r = await ask('analyze', START, this.s.moves.slice(0, beforeMoves.length + 1), { depth: 2, time: 500 });
            let why = '';
            if (r.best) {
              const ag = new Chess(START); for (const x of beforeMoves) ag.make(ag.moveFromUci(x)); ag.make(ag.moveFromUci(u));
              const rm = ag.moveFromUci(r.best), piece = describeCapture(ag, rm);
              if (piece) why = ` It lets them take your ${piece} with ${ag.san(rm)}.`;
            }
            msg = `<b>${label}.</b>${why} Better was ${bestSan}.`;
          }
        }
        if (t !== token) return;
        if (this.thinking) this.coachMsg = [msg, tone];
        else this.refresh(msg, tone);
      });
    }
    this.turn();
  },
  checkEnd() {
    const st = B.game.status();
    if (!st || this.s.result) return !!this.s.result;
    const userWon = st === 'checkmate' && B.game.turn !== this.userColor();
    const txt = st === 'checkmate' ? (userWon ? 'Checkmate. You win!' : 'Checkmate. The computer wins.')
      : { stalemate: 'Stalemate. It\'s a draw.', fifty: 'Draw by the 50-move rule.', repetition: 'Draw by repetition.', insufficient: 'Draw. Not enough pieces left to checkmate.' }[st];
    this.s.result = txt; this.save();
    const stats = store.get('stats', {}), k = LEVELS[this.s.level].name;
    stats[k] = stats[k] || { w: 0, d: 0, l: 0 };
    stats[k][st === 'checkmate' ? (userWon ? 'w' : 'l') : 'd']++; store.set('stats', stats);
    this.refresh(txt, userWon ? 'good' : '');
    setTimeout(() => sheet(`<h2>${txt}</h2><p>${this.s.sans.length ? Math.ceil(this.s.sans.length / 2) + ' moves.' : ''} Against ${k}: ${stats[k].w} won, ${stats[k].d} drawn, ${stats[k].l} lost.</p>
      <button class="big primary" data-act="newgame">New game</button><button class="big" data-act="close">Look at the board</button>`), 700);
    return true;
  },
  newSheet() {
    const last = store.get('lastSetup', { level: 0, user: 'w' });
    sheet(`<h2>New game</h2>
      <h3>Your pieces</h3>
      <div class="seg wide" id="colorSeg">${[['w', 'White'], ['b', 'Black'], ['r', 'Random']].map(([v, t]) => `<button data-color="${v}" class="${last.user === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      <h3>Computer level</h3>
      ${LEVELS.map((l, i) => `<button class="big lvl ${last.level === i ? 'on' : ''}" data-level="${i}">${l.name}<small>${l.about}</small></button>`).join('')}
      <button class="big primary" data-act="start">Start game</button>`, !!store.get('game', null));
    this.setup = Object.assign({}, last);
  },
  start() {
    store.set('lastSetup', this.setup);
    const user = this.setup.user === 'r' ? (Math.random() < .5 ? 'w' : 'b') : this.setup.user;
    token++; closeSheet(); this.thinking = false;
    this.load({ user, level: this.setup.level, moves: [], sans: [], result: null, hints: 0 });
    this.save();
  },
  undo() {
    if (this.thinking) { token++; this.thinking = false; }
    const uc = this.userColor();
    if (!this.s.moves.length) return;
    let n = B.game.turn === uc ? 2 : 1;
    if (this.s.moves.length < n) n = this.s.moves.length;
    for (let i = 0; i < n; i++) { this.s.moves.pop(); this.s.sans.pop(); }
    if (this.s.moves.length && B.game.turn !== uc && false) {}
    this.s.result = null; this.save(); token++;
    this.load(this.s);
    this.refresh('Move taken back. Your move.');
  },
  async hint() {
    if (!B.canMove() || !this.analysis) return;
    const a = await this.analysis;
    if (!a.best) return;
    this.s.hints++; this.save();
    B.arrows = [[nameSq(a.best.slice(0, 2)), nameSq(a.best.slice(2, 4)), 'var(--arrow)']];
    this.refresh('Try this move.', 'ok');
  },
};

// ===== OPENINGS =====
const Open = {
  enter() {
    $('title').textContent = 'Openings';
    const st = store.get('opening', null);
    this.prog = store.get('openProg', {});
    if (!st) { this.list(); this.load('italian', 'learn'); return; }
    this.load(st.id, st.mode, st.ply);
  },
  list() {
    const row = o => `<button class="big op" data-open="${o.id}">${o.name}${this.prog[o.id] ? `<span class="badge ${this.prog[o.id]}">${this.prog[o.id] === 'mastered' ? 'Mastered' : 'Practiced'}</span>` : ''}<small>${o.blurb}</small></button>`;
    sheet(`<h2>Openings</h2>
      <h3>Play as White</h3>${OPENINGS.filter(o => o.side === 'w').map(row).join('')}
      <h3>Play as Black</h3>${OPENINGS.filter(o => o.side === 'b').map(row).join('')}`, !!this.o);
  },
  load(id, m = 'learn', ply = 0) {
    token++;
    this.o = OPENINGS.find(o => o.id === id) || OPENINGS[0]; this.mode = m; this.mistakes = 0; this.wrong = 0;
    B.orient = this.o.side; B.onMove = mv => this.userMove(mv);
    B.canMove = () => mode === 'openings' && this.mode === 'practice' && !this.done && this.isUserTurn();
    this.done = false;
    this.goto(m === 'learn' ? ply : 0);
    store.set('opening', { id: this.o.id, mode: m, ply: this.ply });
    controls(m === 'learn'
      ? [['olist', 'Openings', 'book'], ['oback', 'Back', 'left'], ['onext', 'Next', 'right', 'primary'], ['opractice', 'Practice', 'target']]
      : [['olist', 'Openings', 'book'], ['orestart', 'Restart', 'undo'], ['oshow', 'Show', 'bulb'], ['olearn', 'Learn', 'eye']]);
    $('ptop').innerHTML = `<span class="who">${this.o.name}</span>`;
    $('pbot').innerHTML = `<span class="who">You play ${this.o.side === 'w' ? 'White' : 'Black'} · ${m === 'learn' ? 'Learn' : 'Practice'}</span>`;
    if (m === 'practice') this.practiceStep();
  },
  goto(ply) {
    const g = new Chess(START), line = this.o.line;
    this.ply = Math.max(0, Math.min(ply, line.length));
    let last = null;
    for (let i = 0; i < this.ply; i++) { const m = g.parseSan(line[i][0]); last = [mFrom(m), mTo(m)]; g.make(m); }
    B.game = g; B.last = last; B.arrows = []; B.sel = -1;
    this.moveList();
    if (this.mode === 'learn') {
      if (this.ply < line.length) { const m = g.parseSan(line[this.ply][0]); B.arrows = [[mFrom(m), mTo(m), 'var(--arrow)']]; }
      const txt = this.ply === 0 ? `${this.o.blurb} Tap <b>Next</b> to see the first move.`
        : `<b>${this.moveNum(this.ply - 1)}${line[this.ply - 1][0]}</b> ${line[this.ply - 1][1]}` + (this.ply === line.length ? ' <br><i>That\'s the main line. Try Practice to play it from memory.</i>' : '');
      status(txt);
      store.set('opening', { id: this.o.id, mode: 'learn', ply: this.ply });
    }
    renderBoard();
  },
  moveNum(i) { return i % 2 === 0 ? `${i / 2 + 1}. ` : `${(i + 1) / 2}… `; },
  moveList() {
    $('movelist').innerHTML = this.o.line.slice(0, this.ply).map((x, i) => (i % 2 === 0 ? `<em>${i / 2 + 1}.</em>` : '') + `<span${i === this.ply - 1 ? ' class="cur"' : ''}>${x[0]}</span>`).join(' ');
    $('movelist').scrollLeft = 1e5;
  },
  isUserTurn() { return (B.game.turn === 8 ? 'w' : 'b') === this.o.side; },
  async practiceStep() {
    const t = token, line = this.o.line;
    if (this.ply >= line.length) return this.finish();
    if (!this.isUserTurn()) {
      await sleep(600); if (t !== token) return;
      const m = B.game.parseSan(line[this.ply][0]);
      B.game.make(m); B.last = [mFrom(m), mTo(m)]; B.animate = B.last; this.ply++;
      this.moveList();
      status(`<b>${this.moveNum(this.ply - 1)}${line[this.ply - 1][0]}</b> ${line[this.ply - 1][1]}` + (this.ply < line.length ? '<br>Your move.' : ''));
      renderBoard();
      return this.practiceStep();
    }
    this.wrong = 0;
    if (this.ply === 0) status(`Play the ${this.o.name} from memory. Your move.`);
    renderBoard();
  },
  userMove(m) {
    const line = this.o.line, want = B.game.parseSan(line[this.ply][0]);
    if (m !== want) {
      this.wrong++; this.mistakes++;
      if (this.wrong >= 2) { B.arrows = [[mFrom(want), mTo(want), 'var(--arrow)']]; status(`Not the book move. The ${this.o.name} continues with <b>${line[this.ply][0]}</b>. Play it.`, 'warn'); }
      else status('Not the book move. Try again.', 'warn');
      renderBoard(); return;
    }
    B.game.make(m); B.last = [mFrom(m), mTo(m)]; B.arrows = []; this.ply++;
    this.moveList();
    status(`<b>${this.moveNum(this.ply - 1)}${line[this.ply - 1][0]}</b> ${line[this.ply - 1][1]}`, 'good');
    renderBoard();
    this.practiceStep();
  },
  finish() {
    this.done = true;
    const clean = this.mistakes === 0;
    if (clean || !this.prog[this.o.id]) this.prog[this.o.id] = clean ? 'mastered' : 'practiced';
    store.set('openProg', this.prog);
    status(clean ? `<b>Perfect.</b> You played the whole ${this.o.name} from memory.` : `<b>Line complete</b> with ${this.mistakes} slip${this.mistakes > 1 ? 's' : ''}. Restart to go for a perfect run.`, clean ? 'good' : 'ok');
    renderBoard();
  },
  show() {
    if (this.done) return;
    const want = B.game.parseSan(this.o.line[this.ply][0]);
    B.arrows = [[mFrom(want), mTo(want), 'var(--arrow)']]; this.mistakes++; renderBoard();
  },
};

// ===== PUZZLES =====
const Puz = {
  enter() {
    $('title').textContent = 'Puzzles';
    this.solved = store.get('solved', {});
    const id = store.get('puzzle', null);
    if (!id) { this.list(); this.load(PUZZLES[0].id); return; }
    this.load(id);
  },
  list() {
    const lv = l => PUZZLES.filter(p => p.level === l).map((p, i) => `<button class="pz ${this.solved[p.id] || ''}" data-puz="${p.id}"><b>${i + 1}</b><span>${p.title}</span></button>`).join('');
    const count = l => PUZZLES.filter(p => p.level === l && this.solved[p.id]).length + '/' + PUZZLES.filter(p => p.level === l).length;
    sheet(`<h2>Puzzles</h2>${[1, 2, 3].map(l => `<h3>${PUZZLE_LEVELS[l]} <span class="count">${count(l)} solved</span></h3><div class="pzgrid">${lv(l)}</div>`).join('')}
      <p class="note">Green means solved on the first try. Yellow means solved with help.</p>`, !!this.p);
  },
  load(id) {
    token++;
    this.p = PUZZLES.find(p => p.id === id) || PUZZLES[0]; store.set('puzzle', this.p.id);
    const g = new Chess(this.p.fen);
    this.startFen = this.p.fen || START; this.pre = [];
    if (this.p.moves) for (const s of this.p.moves.split(' ')) { const m = g.parseSan(s); this.pre.push(uci(m)); g.make(m); }
    this.side = g.turn; this.left = this.p.n; this.played = []; this.helped = false; this.done = false;
    B.game = g; B.orient = g.turn === 8 ? 'w' : 'b'; B.arrows = []; B.marks = {}; B.sel = -1;
    if (this.pre.length) { const u = this.pre[this.pre.length - 1]; B.last = [nameSq(u.slice(0, 2)), nameSq(u.slice(2, 4))]; } else B.last = null;
    B.onMove = m => this.userMove(m);
    B.canMove = () => mode === 'puzzles' && !this.done && !this.busy && B.game.turn === this.side;
    controls([['plist', 'Puzzles', 'grid'], ['phint', 'Hint', 'bulb'], ['psolve', 'Solution', 'eye'], ['pnext', 'Next', 'right', 'primary']]);
    const lvl = PUZZLE_LEVELS[this.p.level], idx = PUZZLES.filter(p => p.level === this.p.level).indexOf(this.p) + 1;
    $('ptop').innerHTML = `<span class="who">${lvl} ${idx} · ${this.p.title}</span>`;
    $('pbot').innerHTML = this.solved[this.p.id] ? `<span class="who solvedtag">Solved before</span>` : '';
    $('movelist').innerHTML = this.p.moves ? `<span class="muted">After ${this.p.moves.split(' ').map((s, i) => (i % 2 ? '' : (i / 2 + 1) + '.') + s).join(' ')}</span>` : '';
    this.prompt();
    renderBoard();
    this.analyze();
  },
  prompt(extra = '') {
    const who = this.side === 8 ? 'White' : 'Black';
    const goal = this.p.goal === 'mate' ? `checkmate in ${this.left}` : this.p.goal === 'win' ? 'win material' : 'find the best move';
    status(`${extra}<b>${who} to move:</b> ${goal}.`);
  },
  moves() { return this.pre.concat(this.played); },
  analyze() {
    const depth = this.p.goal === 'mate' ? this.left * 2 : this.p.goal === 'best' ? 5 : 4;
    this.analysis = ask('analyze', this.startFen, this.moves(), { depth, time: 9000 });
  },
  async userMove(m) {
    const t = token, u = uci(m), g = B.game;
    this.busy = true;
    g.make(m); B.last = [mFrom(m), mTo(m)]; B.arrows = []; B.marks = {}; renderBoard();
    let a = null;
    const slow = setTimeout(() => status('Checking…'), 350);
    a = await this.analysis; clearTimeout(slow);
    if (t !== token) return;
    const best = a.scores[0], mine = a.scores.find(x => x.u === u);
    let ok;
    if (g.status() === 'checkmate') ok = true;
    else if (this.p.goal === 'mate') ok = mateIn(mine.s) > 0 && mateIn(mine.s) <= this.left;
    else if (this.p.goal === 'win') ok = mine.s >= best.s - 60 && mine.s >= Math.min(150, best.s - 60);
    else ok = mine.s >= best.s - 30;
    if (!ok) {
      this.helped = true;
      status('Not quite. Try again.', 'bad');
      B.marks = { [mTo(m)]: 'wrong' }; renderBoard();
      await sleep(700); if (t !== token) return;
      g.unmake(); B.marks = {}; B.last = null; this.busy = false; renderBoard();
      this.prompt('<span class="retry">Try again.</span> ');
      return;
    }
    this.played.push(u); this.left--;
    if (g.status() === 'checkmate' || this.left <= 0) return this.win();
    status('<b>Good.</b> Keep going…', 'good');
    await sleep(500); if (t !== token) return;
    const r = await ask('move', this.startFen, this.moves(), { depth: 4, time: 1500, noise: 0 });
    if (t !== token || !r.move) return;
    const rm = g.moveFromUci(r.move); const san = g.san(rm);
    g.make(rm); this.played.push(r.move); B.last = [mFrom(rm), mTo(rm)]; B.animate = B.last;
    this.busy = false; renderBoard();
    this.prompt(`They reply ${san}. `);
    this.analyze();
  },
  win() {
    this.done = true; this.busy = false;
    const first = !this.helped;
    if (first || !this.solved[this.p.id]) this.solved[this.p.id] = first ? 'clean' : 'helped';
    store.set('solved', this.solved);
    const total = Object.keys(this.solved).length;
    status(`<b>${first ? 'Solved!' : 'Solved with help.'}</b> ${total} of ${PUZZLES.length} puzzles done. Tap Next.`, 'good');
    renderBoard();
  },
  async hint() {
    if (this.done || this.busy) return;
    const a = await this.analysis;
    if (!a.best) return;
    this.helped = true;
    const from = nameSq(a.best.slice(0, 2));
    B.marks = { [from]: 'hint' }; renderBoard();
    status(`Hint: move your <b>${PNAME[B.game.b[from] & 7]}</b>.`, 'ok');
  },
  async solution() {
    if (this.done) return;
    this.helped = true;
    const a = await this.analysis; if (!a.best) return;
    const t = token;
    const len = this.p.goal === 'mate' ? this.left * 2 - 1 : this.left * 2 - 1;
    const r = await ask('line', this.startFen, this.moves(), { first: a.best, len: Math.max(1, len), depth: 4, time: 1500 });
    if (t !== token) return;
    B.arrows = [[nameSq(a.best.slice(0, 2)), nameSq(a.best.slice(2, 4)), 'var(--arrow)']];
    renderBoard();
    status(`Solution: <b>${r.line.join(' ')}</b><br>Play the arrow move to continue.`, 'ok');
  },
  next() {
    const i = PUZZLES.indexOf(this.p);
    const after = PUZZLES.slice(i + 1).concat(PUZZLES.slice(0, i + 1));
    const nxt = after.find(p => !this.solved[p.id]) || PUZZLES[(i + 1) % PUZZLES.length];
    this.load(nxt.id);
  },
};

}
function sw(key, label, sub = '') { return `<div class="row"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><button class="switch" role="switch" aria-checked="${settings[key]}" data-sw="${key}" aria-label="${label}"></button></div>`; }

  sheet(`<h2>Settings</h2>
    ${seg('theme', 'Appearance', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}
    ${seg('board', 'Board', [['blue', 'Blue'], ['green', 'Green'], ['wood', 'Wood']])}
    ${sw('coords', 'Show coordinates')}
    ${sw('legal', 'Show legal moves')}

    <button class="big primary" data-act="settings">Back</button>`);

$('sheet').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.promo) return promoResolve && promoResolve(+t.dataset.promo);
  if (t.dataset.color) { Play.setup.user = t.dataset.color; t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); return; }
  if (t.dataset.level) { Play.setup.level = +t.dataset.level; document.querySelectorAll('.lvl').forEach(b => b.classList.toggle('on', b === t)); return; }
  if (t.dataset.open) { closeSheet(); return Open.load(t.dataset.open, 'learn'); }
  if (t.dataset.puz) { closeSheet(); return Puz.load(t.dataset.puz); }
  if (t.dataset.sw) { const k = t.dataset.sw; settings[k] = !settings[k]; t.setAttribute('aria-checked', settings[k]); applySettings(); renderBoard(); return; }
  if (t.dataset.seg) { settings[t.dataset.seg] = t.dataset.val; applySettings(); settingsSheet(); renderBoard(); return; }
  switch (t.dataset.act) {
    case 'close': closeSheet(); break;
    case 'start': Play.start(); break;
    case 'newgame': Play.newSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'stats': statsSheet(); break;
    case 'reset':
      if (confirm('Reset game results, puzzle progress and opening progress?')) { ['stats', 'solved', 'openProg'].forEach(k => store.set(k, k === 'stats' ? {} : {})); Puz.solved = {}; Open.prog = {}; toast('Progress reset'); settingsSheet(); }
      break;
  }
});
$('controls').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  switch (t.dataset.ctl) {
    case 'newgame': Play.newSheet(); break;
    case 'undo': Play.undo(); break;
    case 'hint': Play.hint(); break;
    case 'flip': B.orient = B.orient === 'w' ? 'b' : 'w'; Play.refresh(); break;
    case 'olist': Open.list(); break;
    case 'oback': Open.goto(Open.ply - 1); break;
    case 'onext': Open.goto(Open.ply + 1); if (Open.ply) { B.animate = B.last; renderBoard(); } break;
    case 'opractice': Open.load(Open.o.id, 'practice'); break;
    case 'olearn': Open.load(Open.o.id, 'learn'); break;
    case 'orestart': Open.load(Open.o.id, 'practice'); break;
    case 'oshow': Open.show(); break;
    case 'plist': Puz.list(); break;
    case 'phint': Puz.hint(); break;
    case 'psolve': Puz.solution(); break;
    case 'pnext': Puz.next(); break;
  }
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (mode !== t.dataset.tab) setMode(t.dataset.tab); }));
$('menuBtn').addEventListener('click', settingsSheet);
